# The Android app: the signed APKs (CallOfSurvival.apk with the whole game inside, CallOfSurvival-lite.apk that downloads it
# at the first start) on the release of the game's version (…/releases/latest/download/… is always the newest). A tag v<N>
# (a release the owner creates) builds them and creates the release if needed; a change to android/ on main builds them
# again and replaces the APKs on the release v<version in game/version.json>, or on the newest release when there is none.
name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the full APK (the game inside) and the small one (the game downloaded at first start)
        env:
          KEY_PASS: ${{ secrets.KEY_PASS || vars.KEY_PASS }}
        run: |
          set -o pipefail
          if [[ -z "$KEY_PASS" ]]; then
            echo "::error::The signing password is missing: add KEY_PASS as a secret or a variable (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          V=$(python3 -c "import json; print(json.load(open('game/version.json'))['v'])")
          A=android/app/src/main/assets
          mkdir -p $A && cp -r cdn $A/cdn && cp -r game $A/game
          (cd android && gradle :app:assembleRelease -PgameVersion="$V" --no-daemon --stacktrace 2>&1) | tee build.log
          cp android/app/build/outputs/apk/release/app-release.apk full-unsigned.apk
          rm -rf $A/game
          (cd android && gradle :app:assembleRelease -PgameVersion="$V" --no-daemon --stacktrace 2>&1) | tee -a build.log
          cp android/app/build/outputs/apk/release/app-release.apk lite-unsigned.apk
          ls -la full-unsigned.apk lite-unsigned.apk

      - name: Report errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -E "error:|What went wrong|FAILURE|Could not|Execution failed|e: |\.java:[0-9]+" build.log | grep -v "^> Task" | head -10 | while IFS= read -r l; do echo "::error::${l:0:500}"; done
          grep -A6 "What went wrong" build.log | head -14 | while IFS= read -r l; do echo "::warning::${l:0:500}"; done

      - name: Sign with every scheme and check like an installer
        env:
          KEY_PASS: ${{ secrets.KEY_PASS || vars.KEY_PASS }}
        run: |
          # Gradle leaves out the old JAR signature (v1) when minSdk >= 24; some phones' installers still want it
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          enc() { sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'; }
          for k in full:CallOfSurvival.apk lite:CallOfSurvival-lite.apk; do
            "$BT/apksigner" sign --ks android/release.p12 --ks-type PKCS12 --ks-key-alias cos \
              --ks-pass env:KEY_PASS --key-pass env:KEY_PASS \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out "${k#*:}" "${k%%:*}-unsigned.apk"
            "$BT/apksigner" verify --min-sdk-version 21 "${k#*:}"
            "$BT/zipalign" -c 4 "${k#*:}"
            echo "::notice title=${k#*:}::$(stat -c %s "${k#*:}") bytes%0A$("$BT/apksigner" verify --verbose --min-sdk-version 21 "${k#*:}" 2>&1 | head -5 | enc)"
          done

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 -c "import json; print(json.load(open('game/version.json'))['v'])")
          TAG="v$V"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" CallOfSurvival.apk CallOfSurvival-lite.apk --clobber
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$TAG" --title "Call of Survival $TAG" \
              --notes "نزّل CallOfSurvival.apk وثبّته على هاتفك (اسمح بتثبيت التطبيقات من هذا المصدر). التحديثات التالية تصل من داخل اللعبة."
            gh release upload "$TAG" CallOfSurvival.apk CallOfSurvival-lite.apk --clobber
          else
            # no release for this version (only the owner can create one): the newest release gets the new APKs
            LATEST=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
            if [[ -n "$LATEST" ]]; then
              gh release upload "$LATEST" CallOfSurvival.apk CallOfSurvival-lite.apk --clobber
              echo "::notice::No release $TAG: the APKs of $LATEST (the newest release) were replaced by version $V"
            else
              echo "::notice::No release yet; the APK stays a workflow artifact"
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CallOfSurvival-apk
          path: CallOfSurvival*.apk
          retention-days: 3
